<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMG Placeholder</title>
  <link rel="icon" href="/ico.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/page-shared.css">
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; display: flex; flex-direction: column; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .topbar { height: 64px; padding: 0 28px; display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.92); border-bottom: 1px solid #e1e7f0; }
    .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; background: #2563eb; color: #fff; font-size: 18px; font-weight: 700; }
    h1 { margin: 0; font-size: 19px; letter-spacing: 0; }
    .workspace { width: min(75vw, 2048px); min-width: 1280px; height: calc(100vh - 64px); margin: 0 auto; display: flex; overflow: hidden; background: #fff; }
    .controls { width: 420px; flex: 0 0 420px; overflow-y: auto; border-right: 1px solid #e1e7f0; }
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); padding: 16px 16px 0; border-bottom: 1px solid #e1e7f0; }
    .tab { min-height: 42px; padding: 0 8px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #718096; font-weight: 600; font-size: 12px; }
    .tab.active { color: #2563eb; border-bottom-color: #2563eb; }
    .panel { display: none; padding: 24px; }
    .panel.active { display: block; }
    .field { margin-bottom: 18px; }
    .field label { display: block; margin-bottom: 7px; color: #526176; font-size: 12px; font-weight: 600; }
    .dimensions { display: grid; grid-template-columns: 1fr 20px 1fr; align-items: end; gap: 10px; }
    .dimension-field label { margin-bottom: 7px; }
    .times { padding-bottom: 11px; text-align: center; color: #9aa7ba; }
    input, textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 6px; padding: 10px 11px; color: #172033; background: #f8fafc; outline: none; }
    input:focus, textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    input[type="range"] { padding: 0; accent-color: #2563eb; }
    .segmented { display: flex; padding: 3px; gap: 3px; border: 1px solid #cbd5e1; border-radius: 7px; background: #eef2f7; }
    .segmented button { flex: 1; border: 0; border-radius: 5px; padding: 8px 6px; background: transparent; color: #66758a; font-size: 12px; font-weight: 600; }
    .segmented button.active { background: #fff; color: #1d4ed8; box-shadow: 0 1px 3px rgba(15,23,42,.12); }
    .segmented-input { display: flex; overflow: hidden; border: 1px solid #cbd5e1; border-radius: 7px; background: #f8fafc; }
    .segmented-input span { display: grid; place-items: center; min-width: 70px; padding: 0 10px; border-right: 1px solid #cbd5e1; background: #eef2f7; color: #526176; font-size: 12px; font-weight: 600; }
    .segmented-input input { border: 0; border-radius: 0; background: transparent; box-shadow: none; }
    .choice-input { margin-top: 8px; }
    .color-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    input[type="color"] { height: 40px; padding: 3px; background: #f8fafc; }
    .switch-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .hint { margin: 6px 0 0; color: #8996a8; font-size: 11px; line-height: 1.5; }
    hr { margin: 22px 0; border: 0; border-top: 1px solid #e8edf4; }
    .switch-row, .range-head, .result-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .switch-row { color: #526176; font-size: 13px; font-weight: 600; }
    .switch-row input { width: auto; accent-color: #2563eb; }
    .preview { min-width: 0; flex: 1; display: flex; flex-direction: column; background: #f7f9fc; }
    .preview-stage { min-height: 0; flex: 1; display: grid; place-items: center; padding: 30px; }
    .preview-frame { max-width: 100%; max-height: 100%; overflow: hidden; border-radius: 8px; background: #fff; box-shadow: 0 14px 40px rgba(15,23,42,.14); }
    #preview-image { display: block; max-width: 100%; max-height: 100%; object-fit: contain; transition: opacity .2s; }
    .result { padding: 18px 26px 24px; background: #fff; border-top: 1px solid #e1e7f0; }
    .result-head { margin-bottom: 8px; color: #526176; font-size: 12px; font-weight: 700; }
    .result-line { display: flex; gap: 8px; }
    .result-line input, textarea { height: 40px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .result-line textarea { resize: none; }
    .small-btn { flex: 0 0 auto; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0 14px; background: #fff; color: #334155; font-size: 12px; font-weight: 600; }
    .small-btn:hover { border-color: #2563eb; color: #1d4ed8; }
    .hidden { display: none !important; }
    .link-button { border: 0; padding: 0; margin-right: 12px; background: transparent; color: #2563eb; font-size: 12px; cursor: pointer; }
    .img-task-view { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 2rem; background: rgba(15,23,42,.22); backdrop-filter: blur(16px) saturate(1.12); }
    .img-task-view.hidden { display: none; }
    .img-task-panel { width: min(680px, 90vw); padding: 1.25rem; border: 1px solid rgba(255,255,255,.65); border-radius: 14px; background: rgba(248,250,252,.78); box-shadow: 0 24px 80px rgba(15,23,42,.28); }
    .img-task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .img-task-card { display: flex; flex-direction: column; gap: 5px; padding: 10px; border: 1px solid rgba(148,163,184,.42); border-radius: 9px; background: rgba(255,255,255,.74); color: #1e293b; text-decoration: none; transition: transform .16s ease, box-shadow .16s ease; }
    .img-task-card:hover, .img-task-card:focus-visible { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(15,23,42,.14); outline: none; }
    .img-task-preview { height: 102px; display: grid; place-items: center; border-radius: 6px; background: linear-gradient(135deg, #dbeafe 0 50%, #bfdbfe 50% 100%); color: #2563eb; font-size: 38px; }
    .img-task-card strong { font-size: 14px; }
    .img-task-card small { color: #64748b; font-size: 11px; }
    @media (max-width: 1279px) { .controls { width: 360px; flex-basis: 360px; } }
    @media (max-width: 760px) { .topbar { padding: 0 16px; } .workspace { height: auto; min-height: calc(100vh - 64px); flex-direction: column; } .controls { width: 100%; flex-basis: auto; max-height: none; border-right: 0; } .preview { min-height: 520px; } .preview-stage { min-height: 280px; } .result-line { flex-wrap: wrap; } .result-line input { min-width: 0; flex: 1 1 100%; } }
  </style>
</head>
<body style="position: relative;">
  <script src="/shared-effects.js"></script>
  <header class="topbar"><div class="brand-mark">▧</div><h1>IMG Placeholder</h1></header>
  <main class="workspace">
    <section class="controls">
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="picsum">高清图</button>
        <button class="tab" data-tab="placehold">占位图（左上）</button>
        <button class="tab" data-tab="dummy">占位图（居中）</button>
      </nav>
      <div class="panel active" data-panel="picsum">
        <div class="field"><label>图片尺寸</label><div class="dimensions"><div class="dimension-field"><label>宽度</label><input id="lp-width" type="number" value="600" min="1" max="5000"></div><span class="times">×</span><div class="dimension-field"><label>高度（不填则为正方形）</label><input id="lp-height" type="number" value="400" min="1" max="5000"></div></div><p class="hint">宽度和高度范围：1 - 5000</p></div>
        <div class="field"><label>图片 ID / seed</label><div class="segmented" data-choice><button class="active" data-choice-value="id">图片ID</button><button data-choice-value="seed">seed</button></div><div class="segmented-input choice-input"><span>ID</span><input id="lp-id" type="number" min="0" max="1084" placeholder="请输入 ID"></div><div class="segmented-input choice-input hidden"><span>seed</span><input id="lp-seed" type="number" min="0" placeholder="请输入 seed"></div><p class="hint">图片 ID 允许输入 0 - 1084。</p></div>
        <hr>
        <div class="field"><label>图片格式</label><div class="segmented" data-format="lp-format"><button class="active" data-value=".jpg">.jpg</button><button data-value=".webp">.webp</button></div></div>
        <div class="field"><div class="switch-pair"><label class="switch-row">黑白效果<input id="lp-grayscale" type="checkbox"></label><label class="switch-row">防止缓存<input id="lp-nocache" type="checkbox" checked></label></div></div>
        <div class="field"><div class="range-head"><label>模糊程度</label><span id="lp-blur-val">0</span></div><input id="lp-blur" type="range" min="0" max="10" value="0"></div>
      </div>
      <div class="panel" data-panel="placehold">
        <div class="field"><label>图片尺寸</label><div class="dimensions"><div class="dimension-field"><label>宽度</label><input id="ph-width" type="number" value="600" min="1" max="5000"></div><span class="times">×</span><div class="dimension-field"><label>高度（不填则为正方形）</label><input id="ph-height" type="number" value="400" min="1" max="5000"></div></div></div>
        <div class="field"><div class="color-row"><div><label>背景颜色</label><input id="ph-bg" type="color" value="#cccccc"></div><div><label>文字颜色</label><input id="ph-text-color" type="color" value="#999999"></div></div></div>
        <div class="field"><label>自定义显示文字（暂不支持中文）</label><input id="ph-text" type="text" placeholder="默认显示图片尺寸"></div>
        <div class="field"><label>图片格式</label><div class="segmented" data-format="ph-format"><button class="active" data-value=".svg">.svg</button><button data-value=".png">.png</button><button data-value=".jpg">.jpg</button><button data-value=".webp">.webp</button><button data-value=".gif">.gif</button><button data-value=".avif">.avif</button></div></div>
      </div>
      <div class="panel" data-panel="dummy">
        <div class="field"><label>图片尺寸</label><div class="dimensions"><div class="dimension-field"><label>宽度</label><input id="di-width" type="number" value="600" min="1" max="5000"></div><span class="times">×</span><div class="dimension-field"><label>高度（不填则为正方形）</label><input id="di-height" type="number" value="400" min="1" max="5000"></div></div></div>
        <div class="field"><div class="color-row"><div><label>背景颜色</label><input id="di-bg" type="color" value="#cccccc"></div><div><label>文字颜色</label><input id="di-text-color" type="color" value="#000000"></div></div></div>
        <div class="field"><label>自定义显示文字（暂不支持中文）</label><input id="di-text" type="text" placeholder="默认显示图片尺寸"></div>
        <div class="field"><label>图片格式</label><div class="segmented" data-format="di-format"><button class="active" data-value=".gif">.gif</button><button data-value=".bmp">.bmp</button><button data-value=".svg">.svg</button><button data-value=".png">.png</button><button data-value=".jpg">.jpg</button></div></div>
      </div>
    </section>
    <section class="preview">
      <div class="preview-stage"><div class="preview-frame"><img id="preview-image" alt="图片预览"></div></div>
      <div class="result">
        <div class="result-head"><span>图片地址</span><span><button class="link-button" id="download-image" type="button">下载图片</button><a id="open-new-tab" target="_blank" rel="noopener">新窗口打开</a></span></div>
        <div class="result-line"><input id="output-url" readonly><button class="small-btn" id="copy-url">复制地址</button></div>
        <div class="result-head" style="margin-top:16px"><span>代码片段</span><div class="segmented" style="width:128px" data-snippet><button class="active" data-value="html">HTML</button><button data-value="markdown">Markdown</button></div></div>
        <div class="result-line"><textarea id="output-snippet" readonly rows="2"></textarea><button class="small-btn" id="copy-snippet">复制代码</button></div>
      </div>
    </section>
  </main>
  <div id="img-task-view" class="img-task-view shared-task-view hidden" aria-hidden="true">
    <div class="img-task-panel shared-task-panel" role="dialog" aria-label="快捷入口">
      <div class="img-task-grid shared-task-grid">
        <a class="img-task-card shared-task-card" href="/" aria-label="打开首页"><div class="img-task-preview shared-task-preview"><img src="/ico.svg" alt="首页图标"></div><strong>首页</strong><small>xy77.github.io</small></a>
        <a class="img-task-card shared-task-card" href="https://xy77.github.io/cursor" aria-label="打开鼠标样式"><div class="img-task-preview shared-task-preview">↖</div><strong>鼠标样式</strong><small>xy77.github.io/cursor</small></a>
      </div>
    </div>
  </div>
  <script>
    const state = { tab: 'picsum', format: '.jpg', snippet: 'html', url: '', choice: 'id' };
    const $ = id => document.getElementById(id);
    const value = id => $(id).value.trim();
    const number = (id, fallback) => Math.min(5000, Math.max(1, Number(value(id)) || fallback));
    const color = id => $(id).value.slice(1);
    function currentDimensions(prefix) { const width = number(prefix + '-width', 600); const rawHeight = value(prefix + '-height'); return [width, rawHeight ? number(prefix + '-height', width) : width]; }
    function picsumUrl() {
      const [w, h] = currentDimensions('lp'); const id = state.choice === 'id' ? value('lp-id') : ''; const seed = state.choice === 'seed' ? value('lp-seed') : '';
      let url = 'https://picsum.photos' + (id ? '/id/' + Math.min(1084, Math.max(0, Number(id))) : seed ? '/seed/' + encodeURIComponent(seed) : '') + '/' + w + '/' + h + state.format;
      const params = []; if ($('lp-grayscale').checked) params.push('grayscale'); const blur = Number($('lp-blur').value); if (blur) params.push('blur=' + blur); if (!id && !seed && $('lp-nocache').checked) params.push('random=' + Date.now());
      return url + (params.length ? '?' + params.join('&') : '');
    }
    function placeholdUrl() { const [w, h] = currentDimensions('ph'); const format = state.format.replace(/^\./, ''); let url = 'https://placehold.co/' + w + 'x' + h + '/' + color('ph-bg') + '/' + color('ph-text-color') + (format ? '/' + format : ''); const text = value('ph-text'); return text ? url + '?text=' + encodeURIComponent(text).replace(/%20/g, '+') : url; }
    function dummyUrl() { const [w, h] = currentDimensions('di'); let url = 'https://dummyimage.com/' + w + 'x' + h + state.format + '/' + color('di-bg').toUpperCase() + '/' + color('di-text-color').toUpperCase(); const text = value('di-text'); return text ? url + '?text=' + encodeURIComponent(text).replace(/%20/g, '+') : url; }
    function generate() { state.url = state.tab === 'picsum' ? picsumUrl() : state.tab === 'placehold' ? placeholdUrl() : dummyUrl(); $('output-url').value = state.url; $('open-new-tab').href = state.url; const [w, h] = currentDimensions(state.tab === 'picsum' ? 'lp' : state.tab === 'placehold' ? 'ph' : 'di'); const alt = '占位图 ' + w + 'x' + h; $('output-snippet').value = state.snippet === 'html' ? '<img src="' + state.url + '" alt="' + alt + '">' : '![' + alt + '](' + state.url + ')'; $('preview-image').src = state.url; }
    document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => { document.querySelectorAll('.tab,.panel').forEach(el => el.classList.remove('active')); btn.classList.add('active'); document.querySelector('[data-panel="' + btn.dataset.tab + '"]').classList.add('active'); state.tab = btn.dataset.tab; state.format = document.querySelector('[data-panel="' + state.tab + '"] [data-format] .active')?.dataset.value || ''; generate(); }));
    document.querySelectorAll('[data-choice] button').forEach(btn => btn.addEventListener('click', () => { state.choice = btn.dataset.choiceValue; btn.parentElement.querySelectorAll('button').forEach(item => item.classList.remove('active')); btn.classList.add('active'); document.querySelectorAll('.choice-input').forEach((field, index) => field.classList.toggle('hidden', index !== (state.choice === 'id' ? 0 : 1))); generate(); }));
    document.querySelectorAll('[data-format] button').forEach(btn => btn.addEventListener('click', () => { const group = btn.parentElement; group.querySelectorAll('button').forEach(item => item.classList.remove('active')); btn.classList.add('active'); state.format = btn.dataset.value; generate(); }));
    document.querySelectorAll('[data-snippet] button').forEach(btn => btn.addEventListener('click', () => { btn.parentElement.querySelectorAll('button').forEach(item => item.classList.remove('active')); btn.classList.add('active'); state.snippet = btn.dataset.value; generate(); }));
    document.querySelectorAll('input').forEach(input => input.addEventListener('input', () => { if (input.id === 'lp-blur-val') return; if (input.id === 'lp-blur') $('lp-blur-val').textContent = input.value; generate(); }));
    $('lp-id').addEventListener('blur', () => { if (Number(value('lp-id')) > 1084) $('lp-id').value = '1'; generate(); });
    $('download-image').addEventListener('click', async () => { try { const response = await fetch(state.url); const blob = await response.blob(); const link = document.createElement('a'); const extension = state.format || '.jpg'; link.href = URL.createObjectURL(blob); link.download = 'xy77.github.io' + extension; link.click(); setTimeout(() => URL.revokeObjectURL(link.href), 1000); } catch { window.open(state.url, '_blank', 'noopener'); } });
    const imgTaskView = $('img-task-view'); let imgBlankFocused = false; let imgSpacePresses = [];
    document.body.addEventListener('click', event => { imgBlankFocused = event.target === document.body; if (imgBlankFocused) document.body.focus({ preventScroll: true }); });
    document.addEventListener('keydown', event => { if (event.code !== 'Space' || event.repeat || !imgBlankFocused || event.target !== document.body) return; event.preventDefault(); const now = Date.now(); imgSpacePresses = imgSpacePresses.filter(time => now - time < 900); imgSpacePresses.push(now); if (imgSpacePresses.length >= 4) { imgTaskView.classList.remove('hidden'); imgTaskView.setAttribute('aria-hidden', 'false'); imgSpacePresses = []; } });
    imgTaskView.addEventListener('click', event => { if (event.target === imgTaskView) { imgTaskView.classList.add('hidden'); imgTaskView.setAttribute('aria-hidden', 'true'); } });
    async function copy(id) { try { await navigator.clipboard.writeText($(id).value); } catch { $(id).select(); document.execCommand('copy'); } }
    $('copy-url').addEventListener('click', () => copy('output-url')); $('copy-snippet').addEventListener('click', () => copy('output-snippet')); generate();
  </script>
</body>
</html>
